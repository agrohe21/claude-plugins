[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "skill-runner"
version = "0.1.0"
description = "Multi-turn agentic skill runner with Deep Agents SDK integration"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.84.0",
    "deepagents>=0.4.10",
    "langchain>=1.2.0",
    "langchain-anthropic>=1.3.0",
    "langchain-aws>=1.4.0",
    "langchain-core>=1.2.0",
    "langgraph>=1.1.0",
    "langgraph-checkpoint>=4.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skill_runner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
